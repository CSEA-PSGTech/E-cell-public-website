name: Frontend Docker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig*.json"
      - "components.json"
      - "Dockerfile"
      - ".dockerignore"
      - "nginx.conf"
      - "security-headers.conf"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH || '/ecell/' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/ecell/api' }}
            VITE_USE_MOCK_API=false
          tags: |
            ghcr.io/csea-psgtech/ecell-frontend:latest
            ghcr.io/csea-psgtech/ecell-frontend:${{ github.sha }}

      - name: Trigger Jenkins deployment
        run: |
          curl -fsS -k -X POST \
            "https://jendc.psgtech.ac.in/generic-webhook-trigger/invoke?token=${{ secrets.JENKINS_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"service":"frontend","image_tag":"${{ github.sha }}","git_sha":"${{ github.sha }}"}'